name: validate pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # ---------- Chinese edition ----------
      - name: Validate SSOT table
        run: python scripts/validate_ssot.py data/养生知识表.csv

      - name: Build survival map
        run: python scripts/build_survival_map.py

      - name: Build constitution self-assessment
        run: python scripts/build_constitution_test.py

      - name: Validate survival map structure and figures
        run: python scripts/validate_survival_map.py

      - name: Validate operating model
        run: python scripts/validate_deep_model.py

      - name: Validate constitution page compliance
        run: python scripts/validate_constitution_html.py

      - name: Injection tests (expect 44/44 blocked)
        run: python scripts/test_survival_map_injection.py

      # ---------- English edition ----------
      - name: Build English knowledge table
        run: python scripts/build_en_kb.py

      - name: Validate English knowledge table and its red lines
        run: python scripts/validate_en_kb.py

      - name: Build English survival map
        run: python scripts/build_en_map.py

      - name: Validate English survival map
        run: python scripts/validate_en_map.py

      # ---------- artifacts ----------
      - name: Check generated files were not tampered with
        run: |
          git diff --exit-code web/ data/wellness_kb.en.csv || {
            echo "::error::generated files differ from a fresh rebuild — commit the latest build output"
            exit 1
          }

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Public-release leak scan
        run: python scripts/leak_scan.py
